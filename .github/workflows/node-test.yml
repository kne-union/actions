on:
  workflow_call:
    inputs:
      run_test:
        description: '为 false 时直接成功退出（供 publish-node 默认跳过测试）'
        required: false
        type: boolean
        default: true
      node-versions:
        description: 'JSON 数组，Node 版本矩阵，例如 ["18","20","22"]'
        required: false
        type: string
        default: '["18","20","22"]'
      install-command:
        description: '依赖安装命令（无 lock 文件时用 npm install，勿用 npm ci）'
        required: false
        type: string
        default: 'npm install'
      test-command:
        description: '测试命令'
        required: false
        type: string
        default: 'npm test'

jobs:
  # 关闭测试时跑空成功 job，调用方 needs 得到 success 而非 skipped，避免 skip 传染
  skip:
    if: ${{ !inputs.run_test }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "run_test=false, skip tests"

  test:
    if: ${{ inputs.run_test }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJson(inputs.node-versions) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          # 不启用 cache: npm —— 许多包不提交 lock，cache 会直接失败
      - name: Install dependencies
        run: ${{ inputs.install-command }}
      - name: Run tests
        run: ${{ inputs.test-command }}
