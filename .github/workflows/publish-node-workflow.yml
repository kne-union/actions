on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
      run_test:
        description: '发布前是否跑 node-test（默认关闭，避免影响现有包）'
        required: false
        type: boolean
        default: false
      node-versions:
        description: '传给 node-test 的 Node 版本矩阵 JSON'
        required: false
        type: string
        default: '["18","20","22"]'
      install-command:
        description: '传给 node-test；无 lock 时用 npm install'
        required: false
        type: string
        default: 'npm install'
      test-command:
        required: false
        type: string
        default: 'npm test'
      developer_document_package_type:
        required: false
        type: string
        default: nodejs
        description: 传给 publish-npm 的 developer-document 包类型（如 nodejs / engineering）
permissions:
  contents: write
  id-token: write

jobs:
  test:
    uses: kne-union/actions/.github/workflows/node-test.yml@master
    with:
      run_test: ${{ inputs.run_test }}
      node-versions: ${{ inputs.node-versions }}
      install-command: ${{ inputs.install-command }}
      test-command: ${{ inputs.test-command }}
  checkout:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/upload-artifact@v6
        with:
          name: build-dist
          include-hidden-files: true
          path: |
            ./
            !.git
            !${{ github.workspace }}/.gitignore
            !${{ github.workspace }}/.gitattributes
            !${{ github.workspace }}/.prettierrc
            !${{ github.workspace }}/.husky
            !${{ github.workspace }}/.github
  publish-npm:
    needs: checkout
    uses: kne-union/actions/.github/workflows/publish-npm-workflow.yml@master
    secrets: inherit
    with:
      package_name: ${{inputs.package_name}}
      developer_document_package_type: ${{inputs.developer_document_package_type}}
  sync-static-data:
    runs-on: ubuntu-latest
    needs: publish-npm
    timeout-minutes: 5
    steps:
      - uses: kne-union/actions-manifest@master
        with:
          token: ${{ secrets.ADMIN_TOKEN }}
  release:
    needs: publish-npm
    uses: kne-union/actions/.github/workflows/npm-release-workflow.yml@master
    secrets: inherit
    with:
      package_name: ${{inputs.package_name}}
