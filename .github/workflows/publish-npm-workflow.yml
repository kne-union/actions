on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
      artifact:
        required: false
        type: string
        default: build-dist
      developer_document_sync_type:
        required: false
        type: string
        default: npm-package
        description: developer-document 同步类型：npm-package（普通 npm 包）或 remote-component（远程组件/远程项目）
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ${{inputs.artifact}}
          path: ./
      - uses: actions/setup-node@v6
        with:
          registry-url: https://registry.npmjs.org/
          node-version: 24
      - name: Determine publish tag
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            TAG=$(echo "$VERSION" | sed -n 's/^[^-]*-\([^.]*\).*/\1/p')
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "Prerelease detected: $VERSION, will publish with tag: $TAG"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "Stable release: $VERSION, will publish with default tag"
          fi
      - name: Publish Npm
        env:
          NODE_AUTH_TOKEN: ${{secrets.KNE_PACKAGE_PUBLISH}}
        run: |
          ARGS="--provenance --access=public"
          if [ "${{ steps.tag.outputs.tag }}" != "latest" ]; then
            ARGS="$ARGS --tag ${{ steps.tag.outputs.tag }}"
          fi
          npm publish $ARGS
  sync-cnpm:
    runs-on: ubuntu-latest
    needs: publish
    continue-on-error: true
    steps:
      - name: Sync To Cnpm
        continue-on-error: true
        timeout-minutes: 2
        run: timeout 100 npx cnpm sync ${{inputs.package_name}} || true
  sync-developer-document:
    runs-on: ubuntu-latest
    needs: publish
    continue-on-error: true
    if: ${{ secrets.DEVELOPER_DOCUMENT_OPENAPI_APP_ID != '' && secrets.DEVELOPER_DOCUMENT_OPENAPI_APP_SECRET != '' }}
    timeout-minutes: 2
    steps:
      - name: Sync To Developer Document
        continue-on-error: true
        env:
          SYNC_URL: ${{ vars.DEVELOPER_DOCUMENT_SYNC_URL || secrets.DEVELOPER_DOCUMENT_SYNC_URL || 'https://develop.leapin-ai.com/api/v1' }}
          OPENAPI_APP_ID: ${{ secrets.DEVELOPER_DOCUMENT_OPENAPI_APP_ID }}
          OPENAPI_APP_SECRET: ${{ secrets.DEVELOPER_DOCUMENT_OPENAPI_APP_SECRET }}
          OPENAPI_EXPIRE_SECONDS: ${{ vars.DEVELOPER_DOCUMENT_OPENAPI_EXPIRE_SECONDS || '300' }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          PACKAGE_VERSION: ${{ needs.publish.outputs.version }}
          DEVELOPER_DOCUMENT_SYNC_TYPE: ${{ inputs.developer_document_sync_type }}
        run: |
          export HEADERS_JSON=$(npx -y @kne/npm-tools generateOpenApiSignature \
            --app-id "$OPENAPI_APP_ID" \
            --app-secret "$OPENAPI_APP_SECRET" \
            --expire-seconds "$OPENAPI_EXPIRE_SECONDS")
          node <<'NODE'
          const headers = JSON.parse(process.env.HEADERS_JSON).headers;
          const syncUrl = (process.env.SYNC_URL || 'https://develop.leapin-ai.com/api/v1').replace(/\/$/, '');
          const packageName = process.env.PACKAGE_NAME;
          const syncType = process.env.DEVELOPER_DOCUMENT_SYNC_TYPE || 'npm-package';

          let path;
          let body;
          if (syncType === 'remote-component') {
            const remote = packageName.includes('/')
              ? packageName.split('/').slice(1).join('/')
              : packageName.replace(/^@/, '');
            path = '/open-api/sync/remote-component';
            body = { remote, packageName };
          } else {
            path = '/open-api/sync/npm-package';
            body = { packageName };
            if (process.env.PACKAGE_VERSION) {
              body.version = process.env.PACKAGE_VERSION;
            }
          }

          fetch(`${syncUrl}${path}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...headers
            },
            body: JSON.stringify(body)
          })
            .then(async response => {
              const text = await response.text();
              if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${text}`);
              }
              console.log(`Developer Document sync succeeded (${syncType}): ${text}`);
            })
            .catch(error => {
              console.error(`Developer Document sync failed (${syncType}): ${error.message}`);
              process.exit(1);
            });
          NODE
