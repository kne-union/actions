on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
      artifact:
        required: false
        type: string
        default: build-dist
      developer_document_sync_type:
        required: false
        type: string
        default: npm-package
        description: developer-document 同步类型：npm-package（普通 npm 包）或 remote-component（远程组件/远程项目）
      developer_document_sync:
        required: false
        type: boolean
        default: true
        description: 是否同步 developer-document；example 等附属包发布应设为 false
      developer_document_package_type:
        required: false
        type: string
        default: other
        description: 自动创建 npm 包时的 type（frontend/nodejs/engineering/miniprogram/prompts/other）；仅 npm-package 同步生效
    outputs:
      version:
        description: 本次发布的 package.json version
        value: ${{ jobs.publish.outputs.version }}
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ${{inputs.artifact}}
          path: ./
      - uses: actions/setup-node@v6
        with:
          registry-url: https://registry.npmjs.org/
          node-version: 24
      - name: Determine publish tag
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            TAG=$(echo "$VERSION" | sed -n 's/^[^-]*-\([^.]*\).*/\1/p')
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "Prerelease detected: $VERSION, will publish with tag: $TAG"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "Stable release: $VERSION, will publish with default tag"
          fi
      - name: Publish Npm
        env:
          NODE_AUTH_TOKEN: ${{secrets.KNE_PACKAGE_PUBLISH}}
        run: |
          ARGS="--provenance --access=public"
          if [ "${{ steps.tag.outputs.tag }}" != "latest" ]; then
            ARGS="$ARGS --tag ${{ steps.tag.outputs.tag }}"
          fi
          npm publish $ARGS
  sync-cnpm:
    runs-on: ubuntu-latest
    needs: publish
    continue-on-error: true
    steps:
      - name: Sync To Cnpm
        continue-on-error: true
        timeout-minutes: 2
        run: timeout 100 npx cnpm sync ${{inputs.package_name}} || true
  sync-developer-document:
    if: inputs.developer_document_sync
    runs-on: ubuntu-latest
    needs: publish
    continue-on-error: true
    timeout-minutes: 2
    steps:
      - name: Generate Open API signature
        id: sign
        continue-on-error: true
        env:
          OPENAPI_APP_ID: ${{ secrets.DEVELOPER_DOCUMENT_OPENAPI_APP_ID }}
          OPENAPI_APP_SECRET: ${{ secrets.DEVELOPER_DOCUMENT_OPENAPI_APP_SECRET }}
          OPENAPI_EXPIRE_SECONDS: ${{ vars.DEVELOPER_DOCUMENT_OPENAPI_EXPIRE_SECONDS || '300' }}
        run: |
          if [ -z "$OPENAPI_APP_ID" ] || [ -z "$OPENAPI_APP_SECRET" ]; then
            echo "DEVELOPER_DOCUMENT OpenAPI credentials not configured, skipping sync"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx -y @kne/npm-tools@0.1.65 generateOpenApiSignature \
            --app-id "$OPENAPI_APP_ID" \
            --app-secret "$OPENAPI_APP_SECRET" \
            --expire-seconds "$OPENAPI_EXPIRE_SECONDS" \
            --github-env
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Sync To Developer Document
        if: steps.sign.outputs.skip != 'true'
        continue-on-error: true
        env:
          SYNC_URL: ${{ vars.DEVELOPER_DOCUMENT_SYNC_URL || secrets.DEVELOPER_DOCUMENT_SYNC_URL || 'https://develop.leapin-ai.com/api/v1' }}
          OPENAPI_APP_ID: ${{ secrets.DEVELOPER_DOCUMENT_OPENAPI_APP_ID }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          PACKAGE_VERSION: ${{ needs.publish.outputs.version }}
          DEVELOPER_DOCUMENT_SYNC_TYPE: ${{ inputs.developer_document_sync_type }}
          DEVELOPER_DOCUMENT_PACKAGE_TYPE: ${{ inputs.developer_document_package_type }}
        run: |
          node <<'NODE'
          const { execSync } = require('node:child_process');
          const syncUrl = (process.env.SYNC_URL || 'https://develop.leapin-ai.com/api/v1').replace(/\/$/, '');
          const packageName = process.env.PACKAGE_NAME;
          const packageType = process.env.DEVELOPER_DOCUMENT_PACKAGE_TYPE || 'other';
          let syncType = process.env.DEVELOPER_DOCUMENT_SYNC_TYPE || 'npm-package';
          // @kne-components/* 默认走远程组件同步
          if (syncType === 'npm-package' && packageName.startsWith('@kne-components/')) {
            syncType = 'remote-component';
          }

          const headers = {
            'Content-Type': 'application/json',
            'x-openapi-appid': process.env.OPENAPI_APP_ID,
            'x-openapi-timestamp': process.env.OPENAPI_TIMESTAMP,
            'x-openapi-expire': process.env.OPENAPI_EXPIRE,
            'x-openapi-signature': process.env.OPENAPI_SIGNATURE
          };

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const waitForNpm = async () => {
            const delays = [2000, 5000, 8000, 10000];
            for (let i = 0; i < delays.length; i += 1) {
              try {
                execSync(`npm view ${packageName} version`, { stdio: ['ignore', 'pipe', 'ignore'] });
                return;
              } catch (e) {
                console.log(`npm view ${packageName} not ready, retry ${i + 1}/${delays.length}`);
                await sleep(delays[i]);
              }
            }
            console.log(`npm view ${packageName} still not ready, continue sync anyway`);
          };

          (async () => {
            await waitForNpm();

            let path;
            let body;
            if (syncType === 'remote-component') {
              const remote = packageName.includes('/')
                ? packageName.split('/').slice(1).join('/')
                : packageName.replace(/^@/, '');
              path = '/open-api/sync/remote-component';
              body = { remote, packageName };
              if (process.env.PACKAGE_VERSION) {
                body.version = process.env.PACKAGE_VERSION;
              }
            } else {
              path = '/open-api/sync/npm-package';
              body = { packageName, type: packageType };
              if (process.env.PACKAGE_VERSION) {
                body.version = process.env.PACKAGE_VERSION;
              }
            }

            const response = await fetch(`${syncUrl}${path}`, {
              method: 'POST',
              headers,
              body: JSON.stringify(body)
            });
            const text = await response.text();
            if (!response.ok) {
              throw new Error(`HTTP ${response.status}: ${text}`);
            }
            console.log(`Developer Document sync succeeded (${syncType}): ${text}`);
          })().catch(error => {
            console.error(`Developer Document sync failed: ${error.message}`);
            process.exit(1);
          });
          NODE
